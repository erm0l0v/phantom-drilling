name: Build and publish to itch.io

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Godot has to (re)import every asset from scratch on a clean checkout
      # (.godot/ is gitignored). Doing that import inside the same process
      # that also exports can race - textures that just got reimported can
      # get packed before that import is fully settled, which surfaced as
      # "Failed loading resource" errors for exactly the assets referenced
      # by custom Resource .tres files (building/field/ghost visuals) and a
      # hard "configuration errors" failure on the Web preset. Running a
      # separate import-only pass first avoids the race.
      - name: Warm up asset import cache
        run: |
          mkdir -p /tmp/godot-import
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-import
          chmod +x /tmp/godot-import/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          /tmp/godot-import/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 --headless --editor --quit --path .

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          curl -L -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          VERSION="${{ github.run_number }}-${GITHUB_SHA::7}"
          for f in "${{ steps.export.outputs.archive_directory }}"/*; do
            name=$(basename "$f")
            case "$name" in
              *Windows*) channel="windows" ;;
              *Web*) channel="web" ;;
              *) echo "Skipping unrecognized build: $name"; continue ;;
            esac
            /tmp/butler/butler push "$f" "$ITCH_TARGET:$channel" --userversion "$VERSION"
          done
